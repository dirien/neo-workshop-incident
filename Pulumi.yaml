name: neo-workshop-incident
runtime: nodejs
description: >-
  The incident chain Neo diagnoses in the Sep 8 workshop: a payment queue whose
  failures land in a dead-letter queue, a CloudWatch alarm on that queue, and a
  PagerDuty service that pages off it. Carries deliberate configuration faults —
  see FINDINGS.md.
config:
  # pagerduty:token and pagerdutyEmail come from the stack's ESC environment (Pulumi.dev.yaml).
  neo-workshop-incident:pagerdutyEmail:
    description: Email for the PagerDuty users this program creates. Must be on a domain your account accepts.
  aws:region:
    value: eu-central-1
